name: CI/CD Pipeline

on:
  push:
    branches: [practice]
  pull_request:
    branches: [practice]

env:
  IMAGE_NAME: pdf-chunk-viewer
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5        

      - name: Set up Python
        uses: actions/setup-python@v6   
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build Docker image
        run: |
          docker build -t ${{ env.IMAGE_NAME }}:${{ github.sha }} .

      - name: Test container starts
        run: |
          docker run -d --name test-container \
            -p 8501:8501 \
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          sleep 10
          curl --fail http://localhost:8501/_stcore/health || exit 1
          docker stop test-container

deploy:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/practice' && github.event_name == 'push'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Convert repo name to lowercase   # ← ADD THIS STEP
        run: |
          echo "REPO_LOWER=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ env.REPO_LOWER }}/pdf-chunk-viewer:latest
            ghcr.io/${{ env.REPO_LOWER }}/pdf-chunk-viewer:${{ github.sha }}
```

---

